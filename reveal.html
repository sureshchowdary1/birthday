<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bubble Reveal</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #0b1020;
      color: #eef;
      font-family: Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      box-sizing: border-box
    }

    canvas {
      max-width: 100%;
      height: auto;
      cursor: crosshair
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center
    }

    button,
    label.b {
      background: #ffb703;
      color: #0b1020;
      border: 0;
      border-radius: 10px;
      padding: 10px 18px;
      font: 700 15px Georgia, serif;
      cursor: pointer
    }

    p {
      margin: 0;
      opacity: .75;
      font-size: 14px;
      text-align: center
    }

    .menubar {
      position: fixed;
      height: 100vh;
      width: 230px;
      background-color: #ffffff21;
      z-index: 70;
      overflow: hidden;
      left: -230px;
    }

    .open .menubar {
      left: 0;
    }

    .toolbar {
      z-index: 76;
      position: fixed;
      padding: 0.5rem;
      border-radius: 0.25rem;
      margin-top: 8px;
      transition: 5s fade;
      border: 1px solid #fff;
      padding: 14px;
      cursor: pointer;
      left: 10px;
      top: 10px;
    }

    .toolbar::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 2px;
      border-radius: 0.25rem;
      background-color: #fff;
      top: 16px;
      transition: 5s fade;
      transform: translateX(-50%);
    }

    .toolbar::before {
      content: '';
      position: absolute;
      width: 24px;
      height: 2px;
      border-radius: 0.25rem;
      background-color: #fff;
      transition: 5s fade;
      transform: translateX(-50%) translateY(-2px);
    }

    .open .toolbar::after {
      transform: translateX(-50%) rotate(50deg);
      top: initial !important;
    }

    .open .toolbar::before {
      transform: translateX(-50%) translateY(-2px) rotate(-50deg);
      width: 16px !important;
    }

    .open .toolbar {
      left: 190px;
    }

    .menubar ul {
      margin-top: 50px;
      padding: 0;
    }

    .menubar li {
      list-style-type: none;
      padding: 10px;
      border-bottom: 1px solid #ffffff2b;
    }

    .menubar li a {
      text-decoration: none;
      color: #fff;
      font-size: large;
      letter-spacing: 2px;
      font-family: emoji;
    }

    .menubar li a.active {
      color: #000;
    }
  </style>
</head>

<body>
  <div class="toolbar"></div>
  <div class="menubar">
    <ul>
      <li>
        <a href="index.html">Birthday</a>
      </li>
      <li>
        <a href="reveal.html">Reveal</a>
      </li>
      <li>
        <a href="asMatch.html">AS match</a>
      </li>
    </ul>
  </div>
  <canvas id="c"></canvas>
  <div class="row">
    <button id="go">Launch bubble</button>
    <button id="reset">Reset</button>
    <label class="b">Choose your image<input id="file" type="file" accept="image/*" hidden></label>
  </div>
  <p>Each bubble reveals only a small patch. Click to aim bubbles and uncover the whole image.</p>

  <script>
    /* EDIT HERE: your image path */
    const IMAGE_SRC = "./assets/images/junnu/guess.png";
    /* Size of each splash in pixels, for a 560px-wide frame (scaled automatically for other sizes) */
    const SPLASH_MIN = 20, SPLASH_MAX = 35;

    /* State: declared first so layout() can safely use it */
    const COLS = ["#fff8a9", "#9ee1ff", "#f09fba", "#ffd38d", "#b1ffb7", "#f5aeff"];
    let blobs = [], bubbles = [], drops = [], shake = 0, n = 0;

    /* M = margin around frame, FW/FH = frame size, W/H = full canvas size (all recomputed in layout) */
    let M = 80, FW = 560, FH = 360, W = FW + 2 * M, H = FH + 2 * M;
    const cv = document.getElementById("c");
    const ctx = cv.getContext("2d");
    const mk = () => document.createElement("canvas");
    const colorC = mk(), maskC = mk(), tmpC = mk();
    const cc = colorC.getContext("2d"), mc = maskC.getContext("2d"), tc = tmpC.getContext("2d");

    /* image with placeholder fallback */
    const img = new Image();
    function placeholder() {
      const s = `<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360"><text x="280" y="250" font-size="240" text-anchor="middle">💏</text></svg>`;
      img.onerror = null; img.src = "data:image/svg+xml;utf8," + encodeURIComponent(s);
    }

    /* Size the frame to the image's aspect ratio and fit it to the screen */
    function layout() {
      const nw = img.naturalWidth || 560, nh = img.naturalHeight || 360;
      M = window.innerWidth < 600 ? 30 : 80;                          // smaller margin on phones
      const availW = Math.min(window.innerWidth - 24, 1000) - 2 * M;  // max canvas width = 1000
      const availH = window.innerHeight - 170 - 2 * M;                // leave room for buttons + text
      const s = Math.max(0.1, Math.min(availW / nw, availH / nh));

      const oldFW = FW;
      FW = Math.max(100, Math.round(nw * s));
      FH = Math.max(60, Math.round(nh * s));
      W = FW + 2 * M; H = FH + 2 * M;

      cv.width = W; cv.height = H;
      for (const c of [colorC, maskC, tmpC]) { c.width = FW; c.height = FH; }

      /* keep already-revealed splashes in the right place after a resize */
      const k = FW / oldFW;
      blobs.forEach(b => { b.x *= k; b.y *= k; b.r *= k; b.max *= k; });
      bubbles = []; drops = [];
    }

    img.onload = () => { blobs = []; layout(); };  // new image => new frame, start fresh
    img.onerror = placeholder;
    img.src = IMAGE_SRC;

    let rt;
    window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layout, 100); });

    document.getElementById("file").onchange = e => {
      const f = e.target.files[0]; if (f) img.src = URL.createObjectURL(f);
    };

    function launch(tx, ty) {
      const col = COLS[n++ % COLS.length];
      tx = tx ?? FW * (.15 + Math.random() * .7); ty = ty ?? FH * (.15 + Math.random() * .7);
      const side = Math.random() < .5 ? -1 : 1;
      bubbles.push({ sx: side < 0 ? -30 : W + 30, sy: H + 30, tx: tx + M, ty: ty + M, t: 0, col });
    }
    function impact(b) {
      const x = b.tx - M, y = b.ty - M;
      const sc = FW / 560;
      const far = (SPLASH_MIN + Math.random() * (SPLASH_MAX - SPLASH_MIN)) * sc;
      const pts = [...Array(48)].map(() => 2 + Math.random() * .65);

      blobs.push({ x, y, r: 2, max: far, col: b.col, pts, ph: Math.random() * .6 });
      for (let i = 0; i < 34; i++) {
        const a = Math.random() * 6.28, s = 2 + Math.random() * 7;
        drops.push({ x: b.tx, y: b.ty, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, r: 2 + Math.random() * 5, col: b.col, life: 1 })
      }
      shake = 12;
    }
    function blobPath(g, B, k) {
      const N = B.pts.length; g.beginPath();
      for (let i = 0; i <= N; i++) {
        const a = i / N * Math.PI * 2, w = B.pts[i % N] + Math.sin(a * 5 + B.ph + B.r * .04) * .05;
        const px = B.x + Math.cos(a) * B.r * k * w, py = B.y + Math.sin(a) * B.r * k * w;
        i ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.closePath();
    }
    /* Frame has the image's aspect ratio, so draw it stretched exactly to the frame: no cropping, no gaps */
    function drawCover(g) {
      g.drawImage(img, 0, 0, FW, FH);
    }
    function frame() {
      ctx.clearRect(0, 0, W, H);
      let ox = 0, oy = 0; if (shake > 0) { ox = (Math.random() - .5) * shake; oy = (Math.random() - .5) * shake; shake *= .85 }
      ctx.save(); ctx.translate(ox, oy);
      /* empty frame */
      ctx.fillStyle = "#121a30"; ctx.fillRect(M, M, FW, FH);
      ctx.setLineDash([8, 8]); ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 2;
      ctx.strokeRect(M, M, FW, FH); ctx.setLineDash([]);
      /* color spread + image reveal */
      cc.clearRect(0, 0, FW, FH); mc.clearRect(0, 0, FW, FH);
      for (const B of blobs) {
        if (B.r < B.max) B.r += 2 + (B.max - B.r) * .03;
        cc.fillStyle = B.col; blobPath(cc, B, 1); cc.fill();
        mc.fillStyle = "#000"; blobPath(mc, B, .84); mc.fill();
      }
      tc.globalCompositeOperation = "source-over"; tc.clearRect(0, 0, FW, FH);
      if (img.complete && img.naturalWidth) drawCover(tc);
      tc.globalCompositeOperation = "destination-in"; tc.drawImage(maskC, 0, 0);
      ctx.drawImage(colorC, M, M); ctx.drawImage(tmpC, M, M);
      ctx.strokeStyle = "#ffb703"; ctx.lineWidth = 4; ctx.strokeRect(M, M, FW, FH);
      ctx.restore();
      /* flying bubbles */
      bubbles = bubbles.filter(b => {
        b.t += .022; const t = Math.min(b.t, 1), e = t * t * (3 - 2 * t);
        const x = b.sx + (b.tx - b.sx) * e, y = b.sy + (b.ty - b.sy) * e - Math.sin(Math.PI * t) * 110;
        const g = ctx.createRadialGradient(x - 6, y - 7, 2, x, y, 20);
        g.addColorStop(0, "#fff"); g.addColorStop(.25, b.col); g.addColorStop(1, b.col);
        ctx.fillStyle = g; ctx.globalAlpha = .95; ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
        if (b.t >= 1) { impact(b); return false } return true;
      });
      /* droplets */
      drops = drops.filter(d => {
        d.vy += .25; d.x += d.vx; d.y += d.vy; d.life -= .018;
        if (d.life <= 0) return false;
        ctx.globalAlpha = d.life; ctx.fillStyle = d.col; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
        return true;
      });
      requestAnimationFrame(frame);
    }
    cv.onclick = e => {
      const r = cv.getBoundingClientRect(), k = W / r.width;
      const x = (e.clientX - r.left) * k - M, y = (e.clientY - r.top) * k - M;
      if (x >= 0 && y >= 0 && x <= FW && y <= FH) launch(x, y);
    };
    document.getElementById("go").onclick = () => launch();
    document.getElementById("reset").onclick = () => { blobs = []; bubbles = []; drops = []; n = 0 };

    layout();   // initial size (placeholder dimensions) until the image loads
    frame();


    let toolbar = document.querySelector('.toolbar');
    let menu = document.querySelector('.menubar');

    toolbar.addEventListener('click', () => {
      document.body.classList.toggle('open');
      menu.classList.toggle('active');
    })

    document.addEventListener('DOMContentLoaded', () => {
      let lis = menu.querySelectorAll('li a');
      const currentPath = location.pathname.replace(/^\//, '') || 'index.html';
      lis.forEach(e => {
        if (e.getAttribute('href') == currentPath) {
          e.classList.add('active')
        }
      })
    })
  </script>
</body>

</html>
